name: Daily Stock Scanner

on:
  schedule:
    # 22:00 UTC, Mon-Fri.
    # = 5 PM ET (winter) / 6 PM ET (summer).
    # Always after US market close (4 PM ET), so yfinance daily candles are settled.
    - cron: '0 22 * * 1-5'
  # Also allow manual triggering from the Actions tab in GitHub UI
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit log files back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy python-dotenv lxml html5lib requests

      - name: Run the scanner
        env:
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_PORT:  ${{ secrets.SMTP_PORT }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python stock_scanner.py

      - name: Commit scan logs back to repo
        if: always()    # commit even if the scan errored, so we have a record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_scans.jsonl stock_alerts.jsonl sp500.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "scan log $(date -u +%Y-%m-%d)" && git push)
